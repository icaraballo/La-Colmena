<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Prototipo · puzzle hexagonal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#14181f;color:#e8e6e1;
  font:14px/1.4 system-ui,-apple-system,sans-serif;
  height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
  overscroll-behavior:none;touch-action:none;
}
header{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;padding:12px 2px 6px}
.big{font-size:26px;font-weight:600;letter-spacing:-.02em}
.lbl{color:#7d8794;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stat{display:flex;flex-direction:column;gap:1px}
.stat .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.spacer{flex:1}
button{
  background:#232a34;color:#e8e6e1;border:1px solid #333d4a;
  border-radius:8px;padding:7px 13px;font:inherit;cursor:pointer;
}
button:hover{background:#2c3542}
.warn{min-height:18px;font-size:12px;padding:0 2px 6px;color:#7d8794}
.warn.tight{color:#dcc25c}
.warn.over{color:#e8743f;font-weight:600}
#wrap{flex:1;min-height:0;position:relative}
canvas{display:block;touch-action:none}
footer{color:#5c6775;font-size:11px;padding:8px 2px 12px}
</style>
</head>
<body>

<header>
  <div class="stat">
    <span class="lbl">Paso</span>
    <span class="big" id="step">1</span>
  </div>
  <div class="stat">
    <span class="lbl">Puntos</span>
    <span class="v" id="score">0</span>
  </div>
  <div class="stat">
    <span class="lbl">Racha</span>
    <span class="v" id="streak">0</span>
  </div>
  <div class="stat">
    <span class="lbl">Turno</span>
    <span class="v" id="turn">0</span>
  </div>
  <div class="stat">
    <span class="lbl">Casillas</span>
    <span class="v" id="alive">24</span>
  </div>
  <div class="stat">
    <span class="lbl">Meseta</span>
    <span class="v" id="area">24</span>
  </div>
  <div class="spacer"></div>
  <button id="restart">Nueva partida</button>
</header>

<div class="warn" id="warn"></div>

<div id="wrap"><canvas id="board"></canvas></div>

<footer>
  Arrastra sobre <b id="hint">tantas casillas contiguas como indique el paso</b>, todas a la misma altura.
  Cada turno hay que arrastrar una más. Al llegar a 6, arrástralas para cosechar: vuelven a 1.
</footer>

<script src="js/constants.js"></script>
<script src="js/state.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/app.js"></script>
</body>
</html>
